name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.10"
          enable-cache: true

      - run: uv sync --locked

      - name: ruff check
        run: uv run ruff check sdk monitor-service

      - name: ruff format
        run: uv run ruff format --check sdk monitor-service

      - name: isort
        run: uv run isort --check-only sdk monitor-service

      - name: ty
        run: uv run ty check sdk monitor-service

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: monitor-service/deploy/Dockerfile
          push: false
          tags: monitor-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
